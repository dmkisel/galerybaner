name: galerybaner

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-galerybaner}
  FONT_PATH: /app/app/assets/fonts/Inter-Variable.ttf
  CACHE_DIR: /app/data/cache
  CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
  IMAGES_ALLOW_PRIVATE_HOSTS: ${IMAGES_ALLOW_PRIVATE_HOSTS:-true}
  GALLERY_PAGE_SIZE: ${GALLERY_PAGE_SIZE:-12}
  GALLERY_COLUMNS: ${GALLERY_COLUMNS:-4}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-galerybaner}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-galerybaner}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: alembic upgrade head
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment: *app-env
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      - cache:/app/data/cache
      - history:/app/data/history
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health').read()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  # Тесты на отдельной БД: docker compose --profile tools run --rm test
  test:
    profiles: ["tools"]
    build: .
    command: >
      sh -c "pip install --no-cache-dir -q -r requirements-dev.txt
      && alembic upgrade head
      && alembic check
      && pytest -q"
    environment:
      <<: *app-env
      # Отдельный каталог, чтобы тестовые картинки не попадали в том истории.
      HISTORY_DIR: /tmp/history
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-galerybaner}_test
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-galerybaner}_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  cache:
  history:
